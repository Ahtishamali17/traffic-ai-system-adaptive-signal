name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install lightweight test dependencies
        # Full requirements.txt includes torch/ultralytics (multi-GB); CI installs
        # only what the test suite actually imports for fast, reliable runs.
        # Tests requiring torch/ultralytics/deep-sort-realtime are integration
        # tests meant to run in an environment with those installed (see README).
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic pydantic-settings motor pymongo loguru \
                      python-dotenv python-multipart opencv-python-headless numpy \
                      pandas openpyxl reportlab httpx pytest pytest-asyncio

      - name: Run backend test suite
        working-directory: backend
        run: PYTHONPATH=. pytest app/tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f deployment/docker/Dockerfile.backend -t traffic-ai-backend:ci .

      - name: Build frontend image
        run: docker build -f deployment/docker/Dockerfile.frontend -t traffic-ai-frontend:ci .
